# Architecture decisions that future agents must read before structural work.
# Update this from Architecture Council verdicts.

architecture_decisions:
  "<decision-key>":
    value: "<chosen value>"
    lock: "soft|guarded|locked"
    adr: "ADR-0000"
    guardrails:
      - "<rule>"
    reopen_when:
      - "<observable condition>"
    last_reviewed: "YYYY-MM-DD"
