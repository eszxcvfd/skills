name: architecture-council
scale: 0-5
criteria:
  boring_standard:
    weight: 25
    question: "Does this choose the simplest common solution that fits?"
  reversibility:
    weight: 20
    question: "Can the team migrate or roll back without heroic work?"
  maintainability:
    weight: 20
    question: "Will future features, debugging, tests, and onboarding stay cheap?"
  current_fit:
    weight: 15
    question: "Does this fit the team, constraints, scale, and delivery horizon?"
  testability:
    weight: 10
    question: "Can important behavior be tested at stable seams?"
  operational_simplicity:
    weight: 10
    question: "Can the team run, monitor, and debug it with current maturity?"
vetoes:
  - "Contradicts verified evidence without a migration plan"
  - "Requires distributed operations without operational justification"
  - "Locks a decision without naming reopen conditions"
