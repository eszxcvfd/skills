name: database
scale: 0-5
criteria:
  boring_standard:
    weight: 20
    question: "Does this choose a mainstream database/storage pattern the team can hire for and document easily?"
  data_integrity:
    weight: 20
    question: "Does it preserve correctness, constraints, transactions, and ownership boundaries?"
  migration_risk:
    weight: 20
    question: "Can existing and future data move safely with observable rollback points?"
  operational_simplicity:
    weight: 15
    question: "Can the team back up, restore, monitor, scale, and debug it?"
  query_fit:
    weight: 15
    question: "Does it match the access patterns without premature specialization?"
  reversibility:
    weight: 10
    question: "Can the team leave this choice later without rewriting the product?"
vetoes:
  - "No migration or rollback plan"
  - "Data duplicated across owners without reconciliation rules"
  - "Eventual consistency introduced without user-visible correctness policy"
