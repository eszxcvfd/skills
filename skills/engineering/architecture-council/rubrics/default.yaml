name: default
scale: 0-5
criteria:
  boring_standard:
    weight: 25
    question: "Does this choose the simplest common solution that fits, and explain why not if it deviates?"
  reversibility:
    weight: 20
    question: "Can the team migrate or roll back without heroic work?"
  maintainability:
    weight: 20
    question: "Will the 20th feature be cheaper to add, debug, test, and onboard onto?"
  current_fit:
    weight: 15
    question: "Does this fit today's team, scale, constraints, and delivery horizon?"
  testability:
    weight: 10
    question: "Can important behaviour be tested at stable seams without integration-test sprawl?"
  operational_simplicity:
    weight: 10
    question: "Can the team run, monitor, and debug it with current operational maturity?"
vetoes:
  - "Contradicts verified evidence without a migration plan"
  - "Requires distributed operations without operational justification"
  - "Introduces a locked decision while refusing to name reopen conditions"
