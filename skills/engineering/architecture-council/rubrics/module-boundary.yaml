name: module-boundary
scale: 0-5
criteria:
  domain_fit:
    weight: 20
    question: "Do module seams match stable domain concepts rather than framework folders?"
  interface_depth:
    weight: 20
    question: "Does each module expose a small interface with meaningful behaviour behind it?"
  coupling_control:
    weight: 20
    question: "Does it prevent repository/table/model access across module seams?"
  reversibility:
    weight: 15
    question: "Can boundaries be adjusted without rewriting persistence, tests, and public contracts?"
  testability:
    weight: 15
    question: "Can modules be tested through their interfaces rather than internals?"
  boring_standard:
    weight: 10
    question: "Does it avoid bespoke layering unless ordinary modular structure fails?"
vetoes:
  - "Module boundary depends on every module knowing another module's internals"
  - "Business logic lives primarily in controllers, routes, or workers"
  - "Interface exists for only one hypothetical adapter with no concrete second use"
