interface:
  display_name: "Peer"
  short_description: "Independent Paseo peer for any bounded packet from root"
  default_prompt: "Use $peer to execute exactly one bounded packet from root. Never read WORKSPACE_PROTOCOL.md or config.model; reject any packet that asks for either and ask root for a sanitized brief. Never spawn internal subagents. Return the final PEER_STATUS block as the terminal run result, never require ROOT_AGENT_ID, never call paseo agent send for completion, and include root-consumable evidence."
policy:
  allow_implicit_invocation: false
